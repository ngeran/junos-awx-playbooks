---
- name: Step 1 - Connect and Validate Image on EX
  hosts: all
  gather_facts: no
  connection: juniper.device.pyez

  vars:
    ansible_user: admin
    ansible_password: manolis1
    image_filename: "junos-ex-x86-64-25.2R2-S2.tgz"
    expected_md5: "65aa6135da1963993288f48344d1e48d"
    image_full_path: "/var/tmp/{{ image_filename }}"

  tasks:
    - name: 1. Check connectivity and get current version
      juniper.device.command:
        commands: "show version | match Junos:"
        host: "{{ ansible_host }}"
        user: "{{ ansible_user }}"
        passwd: "{{ ansible_password }}"
      register: ver_out
      ignore_errors: yes

    - name: 1b. Fail if unreachable
      fail:
        msg: "Cannot connect. Error: {{ ver_out.msg | default('Unknown error') }}"
      when: ver_out.failed

    - name: 2. Show current version
      debug:
        msg: "Current Junos Version: {{ ver_out.stdout_lines | default([]) }}"

    - name: 3. Check image and get MD5
      juniper.device.command:
        commands: "file checksum md5 {{ image_full_path }}"
        host: "{{ ansible_host }}"
        user: "{{ ansible_user }}"
        passwd: "{{ ansible_password }}"
      register: md5_out
      ignore_errors: yes

    - name: 3b. Fail if image missing
      fail:
        msg: "Image not found. Output: {{ md5_out.stdout | default(md5_out.msg) }}"
      when: md5_out.failed

    - name: 4. Extract MD5
      set_fact:
        actual_md5: "{{ md5_out.stdout[0] | regex_search('[a-f0-9]{32}') }}"

    - name: 4b. Fail if MD5 not parsed
      fail:
        msg: "Could not parse MD5. Raw: {{ md5_out.stdout }}"
      when: actual_md5 is not defined

    - name: 5. Compare MD5
      assert:
        that:
          - actual_md5 == expected_md5
        fail_msg: "MD5 MISMATCH. Expected {{ expected_md5 }}, got {{ actual_md5 }}"
        success_msg: "SUCCESS! Image verified."
