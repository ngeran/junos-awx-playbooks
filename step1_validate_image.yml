---
- name: Step 1 - Connect and Validate Image on EX
  hosts: all
  gather_facts: no

  # AWX 24.6.1's EE ships ansible-core 2.15.12. On that core version the
  # juniper.device.pyez connection plugin crashes with:
  #   'Connection' object has no attribute 'nonetype'
  # (fixed in ansible-core 2.16+). With connection: local the
  # juniper.device modules open the PyEZ session themselves, which works on
  # 2.15 and avoids the misleading
  #   AttributeError: 'JuniperJunosModule' object has no attribute '_pyez_conn'
  # Once the EE is based on ansible-core >= 2.16, you can switch back to:
  #   connection: juniper.device.pyez
  connection: local

  # On the command line Ansible asks for these interactively. In AWX they are
  # supplied by the Job Template survey (see awx-survey.json), and a value
  # passed with -e also skips the prompt.
  vars_prompt:
    - name: image_filename
      prompt: "Image file name on the switch (e.g. junos-arm-32-25.2R2-S2.2.tgz)"
    - name: expected_md5
      prompt: "Expected MD5 checksum of the image"

  vars:
    # The password comes from the AWX Machine credential (or -k locally).
    # Never put the password in the playbook.
    ansible_user: admin

    image_full_path: "/var/tmp/{{ image_filename }}"

  tasks:
    - name: 0. Check the entered MD5 looks valid
      assert:
        that:
          - expected_md5 is match('^[a-fA-F0-9]{32}$')
        fail_msg: "The MD5 must be exactly 32 hexadecimal characters. You entered '{{ expected_md5 }}'."

    # juniper.device.command does not support pipe modifiers such as
    # "| match ...". Run "show version" and filter the output in Ansible.
    - name: 1. Check connectivity and get current version
      juniper.device.command:
        commands: "show version"
        host: "{{ ansible_host | default(inventory_hostname) }}"
        user: "{{ ansible_user }}"
        passwd: "{{ ansible_password | default(omit) }}"
      register: ver_out
      ignore_errors: yes

    - name: 1b. Fail if unreachable
      fail:
        msg: "Cannot connect. Error: {{ ver_out.msg | default('Unknown error') }}"
      when: ver_out.failed | default(false)

    - name: 2. Show current version
      debug:
        msg: "Current Junos Version: {{ ver_out.stdout_lines | default([]) | select('search', 'Junos:') | list }}"

    - name: 3. Check image and get MD5
      juniper.device.command:
        commands: "file checksum md5 {{ image_full_path }}"
        host: "{{ ansible_host | default(inventory_hostname) }}"
        user: "{{ ansible_user }}"
        passwd: "{{ ansible_password | default(omit) }}"
        # Checksumming a ~300 MB image takes longer than the default 30s.
        timeout: 600
      register: md5_out
      ignore_errors: yes

    # A missing file is NOT a failure. Junos reports it inside the command
    # output ("No such file or directory") while the task itself succeeds,
    # so it has to be detected here.
    - name: 4. Extract MD5
      set_fact:
        actual_md5: "{{ md5_out.stdout | default('') | regex_search('[a-f0-9]{32}') }}"

    - name: 4b. Notify and stop if the image is not on the switch
      when: not actual_md5
      block:
        - name: Tell the user to upload the image manually
          debug:
            msg: >-
              Image {{ image_full_path }} was not found on {{ inventory_hostname }}
              and must be uploaded manually. Validation stopped for this host;
              this is not a failure. Raw output:
              {{ md5_out.stdout | default(md5_out.msg | default('No output')) }}

        - name: Stop processing this host
          meta: end_host

    - name: 5. Compare MD5
      assert:
        that:
          - actual_md5 == expected_md5 | lower
        fail_msg: "MD5 MISMATCH. Expected {{ expected_md5 }}, got {{ actual_md5 }}"
        success_msg: "SUCCESS! Image verified."
